{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div style="max-width:380px;margin:64px auto 0">
  <h1>관리자 로그인</h1>
  <p class="subtitle">유사 자료 검색 서비스 관리 화면입니다.</p>
  <div class="card">
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}"
               autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" style="width:100%">로그인</button>
    </form>
  </div>
</div>
{% endblock %}
